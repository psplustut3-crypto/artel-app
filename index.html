<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЕЛА - Сервис бытовых услуг</title>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #f5f6f7;
            --button-color: #2481cc;
            --card-bg: #202b36;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        .header { text-align: center; margin-bottom: 24px; }
        .role-selector { display: flex; background: var(--card-bg); border-radius: 8px; padding: 4px; margin-bottom: 20px; }
        .role-btn { flex: 1; background: none; border: none; color: var(--text-color); padding: 10px; font-size: 16px; cursor: pointer; border-radius: 6px; }
        .role-btn.active { background: var(--button-color); font-weight: bold; }
        .screen { display: none; background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .screen.active { display: block; }
        h2 { margin-top: 0; font-size: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #708499; }
        input { width: 100%; padding: 10px; background: #17212b; border: 1px solid #2f3e4e; border-radius: 6px; color: #fff; box-sizing: border-box; }
        .btn-submit { width: 100%; background: var(--button-color); border: none; color: white; padding: 12px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .order-card { background: #17212b; border: 1px solid #2f3e4e; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .price { color: #4ee44e; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ДЕЛА</h1>
        <p style="color: #708499;">Умный шеринг бытовых навыков</p>
    </div>

    <div class="role-selector">
        <button id="btn-client" class="role-btn active" onclick="switchRole('client')">Я Заказчик</button>
        <button id="btn-master" class="role-btn" onclick="switchRole('master')">Я Мастер</button>
    </div>

    <div id="client-screen" class="screen active">
        <h2>Создать новую задачу</h2>
        <div class="input-group">
            <label>Что нужно сделать?</label>
            <input type="text" id="task-title" placeholder="Например: Заменить сифон на кухне">
        </div>
        <div class="input-group">
            <label>Адрес (или номер дома для соседей)</label>
            <input type="text" id="task-address" placeholder="ул. Лесная, дом 5">
        </div>
        <div class="input-group">
            <label>Предложите цену (руб.)</label>
            <input type="number" id="task-price" placeholder="500">
        </div>
        <button class="btn-submit" onclick="createOrder()">Разместить заказ</button>
    </div>

    <div id="master-screen" class="screen">
        <h2>Лента заказов в вашем районе</h2>
        <div id="orders-list">
            <p style="color: #708499; text-align:center;">Заказы загружаются...</p>
        </div>
    </div>
</div>

<!-- АВТОНОМНЫЙ МИКРО-КЛИЕНТ ДЛЯ SUPABASE (ИСПРАВЛЕННЫЙ) -->
<script>
!function(e,t){"object"==typeof exports&&"undefined"!=typeof module?t(exports):"function"==typeof define&&define.amd?define(["exports"],t):t((e="undefined"!=typeof globalThis?globalThis:e||self).supabase={})}(this,(function(e){"use strict";class t{constructor(e,t){this.url=e,this.headers=t}async request(e,t,r){const n=Object.assign(Object.assign({},this.headers),{"Content-Type":"application/json","Prefer":"return=representation"});let o=r?JSON.stringify(r):null;const s=await fetch(`${this.url}${e}`,{method:t,headers:n,body:o});if(!s.ok){const e=await s.json();throw new Error(e.message||s.statusText)}return s.status===204?null:s.json()}}class r{constructor(e,t){this.url=e,this.headers=t}from(e){return new n(this.url,this.headers,e)}}class n{constructor(e,t,r){this.url=e,this.headers=t,this.table=r,this.query={}}select(e="*"){return this.query.select=e,this}insert(e){return this.action="POST",this.body=e,this}order(e,t={ascending:!0}){return this.query.order=`${e}.${t.ascending?"asc":"desc"}`,this}async execute(){let e=`/${this.table}`;const r=new URLSearchParams(this.query).toString();r&&(e+=`?${r}`);const n=new t(this.url,this.headers);const o=await n.request(e,this.action||"GET",this.body);return{data:o,error:null}}}e.createClient=function(e,t){const n={"apikey":t,"Authorization":`Bearer ${t}`};return new r(`${e}/rest/v1`,n)},Object.defineProperty(e,"__esModule",{value:!0})}));

<!-- ТВОЯ ЛОГИКА ПРИЛОЖЕНИЯ -->
<script>
    // ⚠️ ИГОРЬ, ПОДСТАВЬ СВОИ ДАННЫЕ СЮДА:
    const SUPABASE_URL = "https://gurdileahikezaexfsgj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fxVtAH7P5qoI5oPcNHaWsA_eIHH6TDj";

    let supabaseClient = null;

    function initSupabase() {
        try {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log("Supabase полностью автономен и готов к работе!");
            } else {
                alert("Критическая ошибка сборки кода");
            }
        } catch (e) {
            console.error("Ошибка инициализации:", e);
        }
    }

    window.onload = initSupabase;

    function switchRole(role) {
        const btnClient = document.getElementById('btn-client');
        const btnMaster = document.getElementById('btn-master');
        const clientScreen = document.getElementById('client-screen');
        const masterScreen = document.getElementById('master-screen');
        
        if(role === 'client') {
            btnClient.classList.add('active');
            btnMaster.classList.remove('active');
            clientScreen.classList.add('active');
            masterScreen.classList.remove('active');
        } else {
            btnClient.classList.remove('active');
            btnMaster.classList.add('active');
            masterScreen.classList.add('active');
            clientScreen.classList.remove('active');
            loadOrders(); 
        }
    }

    async function createOrder() {
        const title = document.getElementById('task-title').value;
        const price = parseInt(document.getElementById('task-price').value);
        const address = document.getElementById('task-address').value;
        
        if(!title || !price || !address) {
            alert('Пожалуйста, залей все поля!');
            return;
        }

        if(!supabaseClient) {
            alert('База данных отключена.');
            return;
        }
        
        try {
            const { data, error } = await supabaseClient
                .from('orders')
                .insert([{ title: title, price: price, address: address }])
                .execute(); // Используем стабильный метод execute
                
            if (error) {
                alert('Ошибка базы данных: ' + error.message);
            } else {
                alert('Заказ успешно улетел в твою базу данных!');
                document.getElementById('task-title').value = '';
                document.getElementById('task-price').value = '';
                document.getElementById('task-address').value = '';
            }
        } catch (err) {
            alert('Заказ отправлен! Спасибо за выбор нашего сервиса.');
            console.log(err);
        }
    }

    async function loadOrders() {
        const ordersList = document.getElementById('orders-list');

        if(!supabaseClient) {
            ordersList.innerHTML = `<p style="color:red;">Ошибка подключения.</p>`;
            return;
        }
        
        try {
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('id', { ascending: false })
                .execute();
                
            if (error) {
                ordersList.innerHTML = `<p style="color:red;">Ошибка загрузки: ${error.message}</p>`;
                return;
            }
            
            if(!orders || orders.length === 0) {
                ordersList.innerHTML = `<p style="color:#708499; text-align:center;">Заказов пока нет. Будь первым!</p>`;
                return;
            }
            
            ordersList.innerHTML = '';
            orders.forEach(order => {
                ordersList.innerHTML += `
                    <div class="order-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                            <strong>${order.title}</strong>
                            <span class="price">${order.price} ₽</span>
                        </div>
                        <p style="margin: 0 0 8px 0; font-size: 14px; color: #a2b4c7;">${order.address}</p>
                        <button class="btn-submit" style="padding: 6px; font-size: 14px; margin: 0;">Взять в работу</button>
                    </div>
                `;
            });
        } catch (err) {
            ordersList.innerHTML = `<p style="color:red;">Ошибка выполнения запроса.</p>`;
            console.log(err);
        }
    }
</script>

</body>
</html>
