<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artel — мастера рядом</title>

  <!-- Yandex Maps JS API 2.1 -->
  <script src="https://api-maps.yandex.ru/2.1/?apikey=YOUR_YANDEX_MAPS_API_KEY&lang=ru_RU" type="text/javascript"></script>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/iife.min.js"></script>

  <style>
    :root {
      --primary: #1f6feb;
      --primary-dark: #1556b3;
      --accent: #f59e0b;
      --success: #16a34a;
      --error: #dc2626;
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      padding: 28px 20px 24px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    header p { margin: 6px 0 0; color: #cbd5e1; font-size: 15px; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 28px 0 12px;
    }

    /* Map */
    #map {
      width: 100%;
      height: 420px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #e8eef5;
    }
    .map-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }
    .map-hint .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15);
    }

    /* Upload */
    .upload-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .upload-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .file-input-wrap {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .file-input-wrap input[type=file] {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:active { transform: scale(0.98); }
    .btn.secondary { background: #475569; }
    .btn.secondary:hover { background: #334155; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .upload-status {
      font-size: 14px;
      color: var(--muted);
      margin-top: 10px;
      min-height: 20px;
    }
    .upload-status.error { color: var(--error); }
    .upload-status.success { color: var(--success); }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .preview-grid img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* Master cards */
    .masters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .master-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .master-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }
    .master-head { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }
    .master-name { font-weight: 700; font-size: 16px; }
    .master-trade { color: var(--muted); font-size: 13px; }
    .rating { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
    .stars { color: var(--accent); letter-spacing: 1px; font-size: 15px; }
    .rating-num { font-weight: 700; font-size: 15px; }
    .reviews { color: var(--muted); font-size: 13px; }
    .master-bio { margin-top: 10px; font-size: 14px; color: #334155; }
    .master-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag {
      background: #eef2ff;
      color: var(--primary-dark);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 24px 20px 40px;
    }

    @media (max-width: 600px) {
      #map { height: 320px; }
      header h1 { font-size: 22px; }
    }
  </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <header>
    <h1>Artel</h1>
    <p>Найдите мастера рядом с вами</p>
  </header>

  <main>
    <div class="section-title">Мастера на карте</div>
    <div id="map"></div>
    <div class="map-hint"><span class="dot"></span> Метки показывают примерное расположение мастеров</div>

    <div class="section-title">Загрузить фото заказа</div>
    <div class="upload-card">
      <div class="upload-row">
        <div class="file-input-wrap">
          <button class="btn" type="button">Выбрать фото</button>
          <input type="file" id="photoInput" accept="image/*" multiple />
        </div>
        <button class="btn secondary" id="uploadBtn" type="button" disabled>Загрузить</button>
      </div>
      <div class="upload-status" id="uploadStatus">Выберите одно или несколько изображений</div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <div class="section-title">Рекомендуемые мастера</div>
    <div class="masters-grid" id="mastersGrid"></div>
  </main>

  <footer>Artel · демонстрационная версия</footer>

  <script>
    // --- Supabase client (credentials provided by user) ---
    const SUPABASE_URL = 'https://gurdileahikezaexfsgj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fxVtAH7P5qoI5oPcNHaWsA_eIHH6TDj';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const BUCKET = 'order-photos';

    // --- Fake master data with ratings ---
    const MASTERS = [
      { name: 'Иван Петров', trade: 'Сантехник', rating: 4.8, reviews: 126, lat: 55.7558, lon: 37.6173,
        bio: '10 лет опыта. Монтаж и ремонт труб, установка сантехники.', tags: ['Трубы', 'Краны', 'Унитазы'] },
      { name: 'Анна Смирнова', trade: 'Электрик', rating: 4.9, reviews: 203, lat: 55.7620, lon: 37.6230,
        bio: 'Лицензированный электрик. Проводка, щитки, розетки.', tags: ['Проводка', 'Щитки', 'Розетки'] },
      { name: 'Сергей Иванов', trade: 'Плотник', rating: 4.6, reviews: 88, lat: 55.7480, lon: 37.6090,
        bio: 'Мебель на заказ, ремонт деревянных конструкций.', tags: ['Мебель', 'Двери', 'Полы'] },
      { name: 'Мария Кузнецова', trade: 'Маляр', rating: 4.7, reviews: 154, lat: 55.7510, lon: 37.6300,
        bio: 'Покраска стен и потолков, декоративные покрытия.', tags: ['Покраска', 'Шпаклёвка'] },
      { name: 'Дмитрий Соколов', trade: 'Кафельщик', rating: 4.5, reviews: 67, lat: 55.7400, lon: 37.6200,
        bio: 'Укладка плитки в ванных и кухнях. Любая сложность.', tags: ['Плитка', 'Ванная'] },
      { name: 'Ольга Новикова', trade: 'Уборщица', rating: 4.9, reviews: 311, lat: 55.7650, lon: 37.6150,
        bio: 'Генеральная и поддерживающая уборка квартир и офисов.', tags: ['Уборка', 'Химчистка'] }
    ];

    // --- Star rendering helper ---
    function stars(rating) {
      const full = Math.floor(rating);
      const half = rating - full >= 0.5;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half ? 1 : 0));
    }

    // --- Render master cards ---
    function renderMasters() {
      const grid = document.getElementById('mastersGrid');
      grid.innerHTML = MASTERS.map(m => `
        <div class="master-card">
          <div class="master-head">
            <img class="avatar" src="https://i.pravatar.cc/100?u=${encodeURIComponent(m.name)}" alt="${m.name}" />
            <div>
              <div class="master-name">${m.name}</div>
              <div class="master-trade">${m.trade}</div>
            </div>
          </div>
          <div class="rating">
            <span class="stars">${stars(m.rating)}</span>
            <span class="rating-num">${m.rating.toFixed(1)}</span>
            <span class="reviews">(${m.reviews} отзывов)</span>
          </div>
          <div class="master-bio">${m.bio}</div>
          <div class="master-tags">${m.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      `).join('');
    }

    // --- Yandex Maps init ---
    ymaps.ready(() => {
      const map = new ymaps.Map('map', {
        center: [55.7558, 37.6173],
        zoom: 11,
        controls: ['zoomControl', 'fullscreenControl']
      });

      MASTERS.forEach(m => {
        const placemark = new ymaps.Placemark([m.lat, m.lon], {
          balloonContentHeader: m.name,
          balloonContentBody: `${m.trade} — рейтинг ${m.rating.toFixed(1)} ★ (${m.reviews} отзывов)`,
          balloonContentFooter: m.bio
        }, {
          preset: 'islands#blueCircleDotIcon',
          balloonMaxWidth: 260
        });
        map.geoObjects.add(placemark);
      });
    });

    // --- Photo upload ---
    const photoInput = document.getElementById('photoInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const previewGrid = document.getElementById('previewGrid');
    let selectedFiles = [];

    photoInput.addEventListener('change', () => {
      selectedFiles = Array.from(photoInput.files);
      previewGrid.innerHTML = '';
      selectedFiles.forEach(f => {
        const url = URL.createObjectURL(f);
        const img = document.createElement('img');
        img.src = url;
        previewGrid.appendChild(img);
      });
      if (selectedFiles.length === 0) {
        uploadBtn.disabled = true;
        uploadStatus.textContent = 'Выберите одно или несколько изображений';
        uploadStatus.className = 'upload-status';
      } else {
        uploadBtn.disabled = false;
        uploadStatus.textContent = `Выбрано файлов: ${selectedFiles.length}`;
        uploadStatus.className = 'upload-status';
      }
    });

    uploadBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;
      uploadBtn.disabled = true;
      uploadStatus.textContent = 'Загрузка...';
      uploadStatus.className = 'upload-status';

      const uploaded = [];
      let failed = 0;
      for (const file of selectedFiles) {
        const ext = file.name.split('.').pop();
        const path = `orders/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error } = await supabase.storage
          .from(BUCKET)
          .upload(path, file, { contentType: file.type, upsert: false });
        if (error) { failed++; }
        else { uploaded.push(path); }
      }

      if (uploaded.length > 0 && failed === 0) {
        uploadStatus.textContent = `Загружено: ${uploaded.length} фото`;
        uploadStatus.className = 'upload-status success';
        previewGrid.innerHTML = '';
        selectedFiles = [];
        photoInput.value = '';
        uploadBtn.disabled = true;
      } else if (failed > 0 && uploaded.length > 0) {
        uploadStatus.textContent = `Загружено ${uploaded.length}, не удалось ${failed}`;
        uploadStatus.className = 'upload-status error';
      } else {
        uploadStatus.textContent = 'Не удалось загрузить фото. Попробуйте ещё раз.';
        uploadStatus.className = 'upload-status error';
        uploadBtn.disabled = false;
      }
    });

    renderMasters();
  </script>
</body>
</html>
